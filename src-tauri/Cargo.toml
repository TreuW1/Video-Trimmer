[package]
name = "VideoTrimmer"
version = "0.1.0"
description = "VideoTrimmer"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# Optimize release builds for smaller size
[profile.release]
opt-level = "z"      # Optimize for size
lto = true            # Link-time optimization
codegen-units = 1     # Better optimization (slower compile)
strip = true          # Strip symbols (reduces size significantly)
panic = "abort"       # Smaller binary (no unwinding code)

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"    
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.9.2", features = ["protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-opener = { git = "https://github.com/tauri-apps/plugins-workspace", branch = "v2" }
tauri-plugin-shell = { git = "https://github.com/tauri-apps/plugins-workspace", branch = "v2" }
tauri-plugin-dialog = "2"
tauri-plugin-fs = { version = "2", features = ["watch"] }
tauri-plugin-prevent-default = { version = "4", features = ["platform-windows"] }
    
